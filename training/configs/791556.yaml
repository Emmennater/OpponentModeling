%YAML 1.2
---
# lczero-training (tf/) configuration for fine-tuning 791556.
#
# The model section describes 791556 exactly, as read from its weights:
# 15 residual blocks of 192 filters with squeeze-and-excitation (ratio 6),
# Mish, the classic 112-plane input, an attention policy head with no
# encoder layers of its own (pol_encoder_layers must be set: for residual
# networks the code defaults to 1), and WDL and moves-left heads.
#
# The dataset reads the generations' games (training/generate_games.py),
# the newest num_chunks of them, one chunk a game: two generations of
# 15,000. With the options lczero-training.patch adds, only the engine's
# positions are trained (skip_unsearched), and a decisive result counts
# value_discount ** plies_left, the rest going to the draw, so a quicker
# mate is worth more: 0.82 at 40 half-moves, 0.64 at 90.
#
# The training section is still a placeholder until the first test run.
# For reference, the network's own record ends at 3,116,000 steps with
# learning rate 0.0004.
name: 'om-791556'                      # no dots: the exporter appends .pb.gz only to names without one
gpu: 0

dataset:
  num_chunks: 30000
  allow_less_chunks: true
  train_ratio: 0.90
  input: '/mnt/c/Users/emmet/Documents/GitHub/OpponentModeling/training/data/gen*/data-*/'
  value_discount: 0.995
  skip_unsearched: true

training:
  precision: 'single'
  batch_size: 1024
  num_batch_splits: 1
  test_steps: 2000
  train_avg_report_steps: 200
  total_steps: 10000
  checkpoint_steps: 2000
  shuffle_size: 250000
  warmup_steps: 100
  lr_values:
    - 0.0002
    - 0.00002
  lr_boundaries:
    - 8000
  policy_loss_weight: 1.0
  value_loss_weight: 1.0
  moves_left_loss_weight: 1.0
  path: '/mnt/c/Users/emmet/Documents/GitHub/OpponentModeling/training/runs'

model:
  filters: 192
  residual_blocks: 15
  se_ratio: 6
  default_activation: 'mish'
  input_type: 'classic'
  policy: 'attention'
  pol_embedding_size: 192
  pol_encoder_layers: 0
  policy_d_model: 192
  value: 'wdl'
  moves_left: 'v1'
...
